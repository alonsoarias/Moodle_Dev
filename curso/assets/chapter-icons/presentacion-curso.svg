<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gradIntro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="55" fill="url(#gradIntro)"/>
  <!-- Book/Course symbol -->
  <rect x="30" y="35" width="60" height="45" rx="3" fill="#fff" opacity="0.9"/>
