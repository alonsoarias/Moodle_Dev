  <!-- Text lines on left page -->
  <line x1="35" y1="45" x2="55" y2="45" stroke="#764ba2" stroke-width="2" opacity="0.6"/>
  <line x1="35" y1="52" x2="55" y2="52" stroke="#764ba2" stroke-width="2" opacity="0.5"/>
  <line x1="35" y1="59" x2="50" y2="59" stroke="#764ba2" stroke-width="2" opacity="0.4"/>
  <line x1="35" y1="66" x2="55" y2="66" stroke="#764ba2" stroke-width="2" opacity="0.5"/>
  <!-- Brain icon on right page -->
  <path d="M70 50 Q67 48 68 45 Q66 42 70 40 Q73 38 78 40 Q82 38 85 42 Q88 45 86 50 Q88 55 82 58 Q78 60 75 58 Q70 60 68 55 Q66 52 70 50" fill="#667eea" opacity="0.7"/>
