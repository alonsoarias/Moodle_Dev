<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5af19;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f12711;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="55" fill="url(#grad10)"/>
  <!-- Eye representing attention -->
  <ellipse cx="60" cy="55" rx="30" ry="20" fill="#fff" opacity="0.9"/>
  <!-- Iris -->
  <circle cx="60" cy="55" r="12" fill="#f5af19"/>
  <!-- Pupil -->
  <circle cx="60" cy="55" r="6" fill="#333"/>
  <!-- Light reflection -->
  <circle cx="57" cy="52" r="2" fill="#fff"/>
  <!-- Focus lines -->
  <line x1="25" y1="55" x2="30" y2="55" stroke="#fff" stroke-width="2"/>
  <line x1="90" y1="55" x2="95" y2="55" stroke="#fff" stroke-width="2"/>
  <line x1="60" y1="25" x2="60" y2="30" stroke="#fff" stroke-width="2"/>
  <line x1="60" y1="80" x2="60" y2="85" stroke="#fff" stroke-width="2"/>
  <!-- Diagonal focus lines -->
  <line x1="35" y1="35" x2="40" y2="40" stroke="#fff" stroke-width="2"/>
  <line x1="85" y1="35" x2="80" y2="40" stroke="#fff" stroke-width="2"/>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Capítulo 10</text>
</svg>
