<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradiente principal -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d2847"/>
      <stop offset="100%" style="stop-color:#1a4a6e"/>
    </linearGradient>

    <!-- Gradiente para agua -->
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00bfff;stop-opacity:0.1"/>
    </linearGradient>

    <!-- Gradiente para cerebro -->
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:#c44569"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Patrón de ondas -->
    <pattern id="waves" x="0" y="0" width="100" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q25 0 50 10 T100 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Ondas de agua decorativas (fondo) -->
  <g opacity="0.3">
    <path d="M0 500 Q150 470 300 500 T600 500 T900 500 T1200 500 L1200 630 L0 630 Z" fill="url(#waterGradient)"/>
    <path d="M0 520 Q150 490 300 520 T600 520 T900 520 T1200 520 L1200 630 L0 630 Z" fill="url(#waterGradient)"/>
    <path d="M0 540 Q150 510 300 540 T600 540 T900 540 T1200 540 L1200 630 L0 630 Z" fill="url(#waterGradient)"/>
  </g>

  <!-- Partículas/estrellas decorativas -->
  <g fill="white" opacity="0.4">
    <circle cx="100" cy="100" r="2"/>
    <circle cx="200" cy="150" r="1.5"/>
    <circle cx="350" cy="80" r="2"/>
    <circle cx="500" cy="120" r="1"/>
    <circle cx="650" cy="90" r="2"/>
    <circle cx="800" cy="140" r="1.5"/>
    <circle cx="950" cy="70" r="2"/>
    <circle cx="1100" cy="110" r="1.5"/>
    <circle cx="150" cy="200" r="1"/>
    <circle cx="450" cy="180" r="1.5"/>
    <circle cx="750" cy="200" r="1"/>
    <circle cx="1050" cy="190" r="2"/>
  </g>

  <!-- Conexiones neuronales decorativas (izquierda) -->
  <g stroke="rgba(255,107,157,0.3)" stroke-width="1" fill="none">
    <path d="M50 300 Q100 250 150 280 Q200 310 180 360"/>
    <path d="M80 350 Q130 320 170 350 Q210 380 190 420"/>
    <path d="M30 380 Q80 400 120 380"/>
    <circle cx="50" cy="300" r="6" fill="rgba(255,107,157,0.5)"/>
    <circle cx="150" cy="280" r="5" fill="rgba(255,107,157,0.4)"/>
    <circle cx="180" cy="360" r="4" fill="rgba(255,107,157,0.3)"/>
    <circle cx="80" cy="350" r="5" fill="rgba(255,107,157,0.4)"/>
    <circle cx="170" cy="350" r="4" fill="rgba(255,107,157,0.3)"/>
    <circle cx="190" cy="420" r="3" fill="rgba(255,107,157,0.2)"/>
  </g>

  <!-- Conexiones neuronales decorativas (derecha) -->
  <g stroke="rgba(0,191,255,0.3)" stroke-width="1" fill="none">
    <path d="M1150 280 Q1100 250 1050 270 Q1000 290 1020 340"/>
    <path d="M1120 330 Q1070 300 1030 330 Q990 360 1010 400"/>
    <path d="M1170 360 Q1120 380 1080 360"/>
    <circle cx="1150" cy="280" r="6" fill="rgba(0,191,255,0.5)"/>
    <circle cx="1050" cy="270" r="5" fill="rgba(0,191,255,0.4)"/>
    <circle cx="1020" cy="340" r="4" fill="rgba(0,191,255,0.3)"/>
    <circle cx="1120" cy="330" r="5" fill="rgba(0,191,255,0.4)"/>
    <circle cx="1030" cy="330" r="4" fill="rgba(0,191,255,0.3)"/>
    <circle cx="1010" cy="400" r="3" fill="rgba(0,191,255,0.2)"/>
  </g>

  <!-- Icono central: Cerebro con agua -->
  <g transform="translate(600, 280)">
    <!-- Círculo de fondo con glow -->
    <circle cx="0" cy="0" r="120" fill="rgba(255,255,255,0.05)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

    <!-- Cerebro simplificado -->
    <g transform="translate(-50, -60)" filter="url(#glow)">
      <path d="M50 20
               C20 20 10 40 15 60
               C5 65 0 80 10 95
               C5 105 10 120 30 120
               L70 120
               C90 120 95 105 90 95
               C100 80 95 65 85 60
               C90 40 80 20 50 20"
            fill="url(#brainGradient)" opacity="0.9"/>
      <!-- Surcos del cerebro -->
      <path d="M30 50 Q50 40 70 50" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <path d="M25 70 Q50 60 75 70" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <path d="M30 90 Q50 80 70 90" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <!-- Línea central -->
      <line x1="50" y1="25" x2="50" y2="115" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    </g>

    <!-- Ondas de agua alrededor -->
    <g stroke="#00bfff" stroke-width="2" fill="none" opacity="0.6">
      <path d="M-80 40 Q-60 30 -40 40 Q-20 50 0 40 Q20 30 40 40 Q60 50 80 40"/>
      <path d="M-90 60 Q-70 50 -50 60 Q-30 70 -10 60 Q10 50 30 60 Q50 70 70 60 Q90 50 90 60" opacity="0.4"/>
    </g>

    <!-- Pequeñas neuronas conectadas -->
    <g fill="#ff6b9d" opacity="0.7">
      <circle cx="-70" cy="-30" r="4"/>
      <circle cx="70" cy="-30" r="4"/>
      <circle cx="-85" cy="10" r="3"/>
      <circle cx="85" cy="10" r="3"/>
    </g>
    <g stroke="#ff6b9d" stroke-width="1" opacity="0.4">
      <line x1="-70" y1="-30" x2="-40" y2="-20"/>
      <line x1="70" y1="-30" x2="40" y2="-20"/>
      <line x1="-85" y1="10" x2="-50" y2="0"/>
      <line x1="85" y1="10" x2="50" y2="0"/>
    </g>
  </g>

  <!-- Título principal -->
  <text x="600" y="450" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" fill="white" filter="url(#glow)">
    Huellas Invisibles
  </text>

  <!-- Subtítulo -->
  <text x="600" y="510" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)">
    Neurodesarrollo y Neuroaprendizaje Acuático
  </text>
  <text x="600" y="540" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)">
    en la Primera Infancia
  </text>

  <!-- Badge de capítulos -->
  <g transform="translate(600, 590)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)">
      10 Capítulos • 75 Actividades
    </text>
  </g>

  <!-- Líneas decorativas -->
  <line x1="250" y1="470" x2="400" y2="470" stroke="rgba(255,107,157,0.5)" stroke-width="2"/>
  <line x1="800" y1="470" x2="950" y2="470" stroke="rgba(0,191,255,0.5)" stroke-width="2"/>
</svg>