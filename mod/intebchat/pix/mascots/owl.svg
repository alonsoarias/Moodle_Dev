<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="mascot-owl">
  <style>
    .mascot-owl {
      cursor: pointer;
    }
    /* Smooth transitions for wise owl */
    #arm-left {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 18px 52px;
    }
    #arm-right {
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 62px 52px;
    }
    #tassel {
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 62px 14px;
    }
    #eyebrows {
      transition: transform 0.3s ease-out;
    }
    #body {
      transition: transform 0.4s ease;
    }
    #cap {
      transition: transform 0.3s ease;
      transform-origin: 40px 14px;
    }
    /* Hover states - attentive owl */
    .mascot-owl:hover #arm-left {
      transform: rotate(-8deg);
    }
    .mascot-owl:hover #arm-right {
      transform: rotate(8deg);
    }
    .mascot-owl:hover #tassel {
      transform: rotate(8deg);
    }
    .mascot-owl:hover #eyebrows {
      transform: translateY(-1px);
    }
    .mascot-owl:hover #body {
      transform: translateY(-1px);
    }
    .mascot-owl:hover #cap {
      transform: rotate(-2deg);
    }
  </style>
  <defs>
    <linearGradient id="owl-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8956c"/>
      <stop offset="50%" style="stop-color:#9d7a5a"/>
      <stop offset="100%" style="stop-color:#8b6f47"/>
    </linearGradient>
    <linearGradient id="owl-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5bc"/>
      <stop offset="100%" style="stop-color:#d4c0a5"/>
    </linearGradient>
    <linearGradient id="owl-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a68960"/>
      <stop offset="100%" style="stop-color:#7d6945"/>
    </linearGradient>
    <linearGradient id="cap-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748"/>
      <stop offset="100%" style="stop-color:#1a202c"/>
    </linearGradient>
    <filter id="owl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="40" cy="77" rx="20" ry="3" fill="#00000015"/>

  <!-- Body -->
  <g id="body" filter="url(#owl-shadow)">
    <!-- Main body -->
    <ellipse cx="40" cy="54" rx="24" ry="24" fill="url(#owl-body)" stroke="#6b5437" stroke-width="2"/>

    <!-- Belly -->
    <ellipse cx="40" cy="56" rx="16" ry="18" fill="url(#owl-belly)"/>

    <!-- Belly feather pattern -->
    <g opacity="0.4">
      <path d="M 30,46 Q 40,50 50,46" fill="none" stroke="#9d7a5a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 28,52 Q 40,57 52,52" fill="none" stroke="#9d7a5a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 30,58 Q 40,64 50,58" fill="none" stroke="#9d7a5a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 33,64 Q 40,69 47,64" fill="none" stroke="#9d7a5a" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Wings/Arms -->
  <g id="arms">
    <!-- Left wing -->
    <g id="arm-left">
      <ellipse cx="16" cy="52" rx="10" ry="20" fill="url(#owl-wing)" stroke="#6b5437" stroke-width="1.5"/>
      <!-- Wing feather details -->
      <path d="M 10,40 Q 8,45 10,50" stroke="#5a4a35" stroke-width="1" opacity="0.5" fill="none"/>
      <path d="M 12,48 Q 9,54 12,60" stroke="#5a4a35" stroke-width="1" opacity="0.5" fill="none"/>
      <path d="M 14,55 Q 11,62 14,68" stroke="#5a4a35" stroke-width="1" opacity="0.5" fill="none"/>
    </g>

    <!-- Right wing -->
    <g id="arm-right">
      <ellipse cx="64" cy="52" rx="10" ry="20" fill="url(#owl-wing)" stroke="#6b5437" stroke-width="1.5"/>
      <!-- Wing feather details -->
      <path d="M 70,40 Q 72,45 70,50" stroke="#5a4a35" stroke-width="1" opacity="0.5" fill="none"/>
      <path d="M 68,48 Q 71,54 68,60" stroke="#5a4a35" stroke-width="1" opacity="0.5" fill="none"/>
      <path d="M 66,55 Q 69,62 66,68" stroke="#5a4a35" stroke-width="1" opacity="0.5" fill="none"/>
    </g>
  </g>

  <!-- Face disc -->
  <ellipse cx="40" cy="32" rx="18" ry="16" fill="url(#owl-belly)" stroke="#6b5437" stroke-width="1"/>

  <!-- Eyes -->
  <g id="eyes">
    <!-- Left eye -->
    <g id="eye-left" transform-origin="32 30">
      <circle cx="32" cy="30" r="10" fill="#ffffff" stroke="#6b5437" stroke-width="2"/>
      <circle cx="32" cy="30" r="6" fill="#2d3748"/>
      <circle cx="34" cy="28" r="2.5" fill="#ffffff"/>
      <circle cx="30" cy="32" r="1" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- Right eye -->
    <g id="eye-right" transform-origin="48 30">
      <circle cx="48" cy="30" r="10" fill="#ffffff" stroke="#6b5437" stroke-width="2"/>
      <circle cx="48" cy="30" r="6" fill="#2d3748"/>
      <circle cx="50" cy="28" r="2.5" fill="#ffffff"/>
      <circle cx="46" cy="32" r="1" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- Eyebrows/Tufts -->
  <g id="eyebrows">
    <path d="M 22,20 Q 27,15 32,18" fill="none" stroke="#8b6f47" stroke-width="3" stroke-linecap="round"/>
    <path d="M 48,18 Q 53,15 58,20" fill="none" stroke="#8b6f47" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Beak -->
  <g id="beak">
    <path d="M 40,38 L 34,48 L 40,46 L 46,48 Z" fill="#ff9500" stroke="#e07c00" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Ear tufts -->
  <path d="M 22,14 L 26,22 L 30,16 Z" fill="url(#owl-body)" stroke="#6b5437" stroke-width="1"/>
  <path d="M 58,14 L 54,22 L 50,16 Z" fill="url(#owl-body)" stroke="#6b5437" stroke-width="1"/>

  <!-- Graduation cap -->
  <g id="cap">
    <!-- Cap board -->
    <polygon points="40,4 12,16 40,22 68,16" fill="url(#cap-gradient)"/>
    <!-- Cap base -->
    <ellipse cx="40" cy="18" rx="16" ry="4" fill="url(#cap-gradient)"/>
    <!-- Cap top -->
    <rect x="32" y="14" width="16" height="4" fill="url(#cap-gradient)"/>

    <!-- Tassel -->
    <g id="tassel">
      <line x1="62" y1="14" x2="72" y2="22" stroke="#ffd700" stroke-width="2.5"/>
      <circle cx="72" cy="24" r="4" fill="#ffd700"/>
      <path d="M 69,26 L 72,34 L 75,26" fill="#ffd700"/>
    </g>
  </g>

  <!-- Feet -->
  <g id="feet">
    <ellipse cx="34" cy="76" rx="5" ry="2.5" fill="#ff9500" stroke="#e07c00" stroke-width="1"/>
    <ellipse cx="46" cy="76" rx="5" ry="2.5" fill="#ff9500" stroke="#e07c00" stroke-width="1"/>
  </g>
</svg>
