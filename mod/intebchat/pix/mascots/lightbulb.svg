<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="mascot-lightbulb">
  <style>
    .mascot-lightbulb {
      cursor: pointer;
    }
    /* Smooth transitions for bright ideas */
    #body {
      transition: filter 0.4s ease, transform 0.3s ease;
    }
    #glow-effect {
      transition: opacity 0.5s ease, rx 0.5s ease, ry 0.5s ease;
    }
    #sparkles {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }
    #arm-left {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 22px 40px;
    }
    #arm-right {
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 58px 40px;
    }
    #eyes {
      transition: transform 0.3s ease;
    }
    /* Hover states - light bulb moment */
    .mascot-lightbulb:hover #body {
      filter: url(#bulb-shadow) brightness(1.1);
      transform: translateY(-1px);
    }
    .mascot-lightbulb:hover #glow-effect {
      opacity: 0.25;
    }
    .mascot-lightbulb:hover #sparkles {
      transform: translateY(-2px) scale(1.1);
    }
    .mascot-lightbulb:hover #arm-left {
      transform: rotate(-10deg);
    }
    .mascot-lightbulb:hover #arm-right {
      transform: rotate(12deg);
    }
    .mascot-lightbulb:hover #eyes {
      transform: scale(1.05);
    }
  </style>
  <defs>
    <linearGradient id="bulb-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff9db"/>
      <stop offset="30%" style="stop-color:#fff3bf"/>
      <stop offset="70%" style="stop-color:#ffe066"/>
      <stop offset="100%" style="stop-color:#ffd43b"/>
    </linearGradient>
    <linearGradient id="bulb-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="bulb-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#868e96"/>
      <stop offset="50%" style="stop-color:#495057"/>
      <stop offset="100%" style="stop-color:#343a40"/>
    </linearGradient>
    <filter id="bulb-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <filter id="bulb-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glow effect -->
  <ellipse id="glow-effect" cx="40" cy="32" rx="30" ry="28" fill="#ffd43b" opacity="0.15" filter="url(#bulb-glow-filter)">
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Shadow -->
  <ellipse cx="40" cy="77" rx="14" ry="3" fill="#00000015"/>

  <!-- Idea sparkles -->
  <g id="sparkles" opacity="0.8">
    <path d="M 12,18 L 8,16 L 12,14 L 10,10" stroke="#ffd43b" stroke-width="2" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 68,18 L 72,16 L 68,14 L 70,10" stroke="#ffd43b" stroke-width="2" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <circle cx="40" cy="4" r="2" fill="#ffd43b">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="20" cy="8" r="1.5" fill="#ffd43b">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="8" r="1.5" fill="#ffd43b">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
  </g>

  <!-- Body - Light bulb glass -->
  <g id="body" filter="url(#bulb-shadow)">
    <!-- Main bulb shape -->
    <path d="M 22,34
             C 22,18 28,8 40,8
             C 52,8 58,18 58,34
             C 58,44 54,50 50,54
             L 50,58
             L 30,58
             L 30,54
             C 26,50 22,44 22,34
             Z"
          fill="url(#bulb-glass)"
          stroke="#fab005"
          stroke-width="2"/>

    <!-- Glass highlight -->
    <path d="M 28,20
             C 28,14 32,10 40,10
             L 40,16
             C 35,16 32,20 32,26
             L 32,40
             C 32,44 34,48 36,50
             L 34,52
             C 30,48 28,42 28,36
             Z"
          fill="url(#bulb-glow)"/>

    <!-- Filament glow -->
    <ellipse cx="40" cy="38" rx="8" ry="10" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Base/Screw part -->
  <g id="base">
    <rect x="30" y="58" width="20" height="4" fill="#495057"/>
    <rect x="32" y="62" width="16" height="3" fill="#6c757d"/>
    <rect x="30" y="65" width="20" height="4" fill="#495057"/>
    <rect x="32" y="69" width="16" height="3" fill="#6c757d"/>
    <rect x="34" y="72" width="12" height="4" rx="2" fill="#343a40"/>
  </g>

  <!-- Eyes -->
  <g id="eyes">
    <!-- Left eye -->
    <g id="eye-left" transform-origin="34 32">
      <ellipse cx="34" cy="32" rx="5" ry="6" fill="#2d3748"/>
      <ellipse cx="35" cy="30" rx="2" ry="2.5" fill="#ffffff"/>
      <circle cx="33" cy="34" r="1" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- Right eye -->
    <g id="eye-right" transform-origin="46 32">
      <ellipse cx="46" cy="32" rx="5" ry="6" fill="#2d3748"/>
      <ellipse cx="47" cy="30" rx="2" ry="2.5" fill="#ffffff"/>
      <circle cx="45" cy="34" r="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- Eyebrows - expressive -->
  <g id="eyebrows">
    <path d="M 28,26 Q 34,23 40,26" fill="none" stroke="#fab005" stroke-width="2" stroke-linecap="round"/>
    <path d="M 40,26 Q 46,23 52,26" fill="none" stroke="#fab005" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Mouth - friendly smile -->
  <g id="mouth">
    <path d="M 35,44 Q 40,50 45,44"
          fill="none"
          stroke="#2d3748"
          stroke-width="2.5"
          stroke-linecap="round"/>
  </g>

  <!-- Arms -->
  <g id="arms">
    <!-- Left arm -->
    <g id="arm-left">
      <path d="M 22,38 Q 12,36 8,42 Q 6,48 10,52"
            fill="none"
            stroke="#ffd43b"
            stroke-width="5"
            stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="10" cy="52" r="5" fill="#ffd43b" stroke="#fab005" stroke-width="1"/>
      <!-- Fingers -->
      <path d="M 6,50 L 4,46" stroke="#fab005" stroke-width="2" stroke-linecap="round"/>
      <path d="M 8,48 L 6,44" stroke="#fab005" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Right arm -->
    <g id="arm-right">
      <path d="M 58,38 Q 68,36 72,42 Q 74,48 70,52"
            fill="none"
            stroke="#ffd43b"
            stroke-width="5"
            stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="70" cy="52" r="5" fill="#ffd43b" stroke="#fab005" stroke-width="1"/>
      <!-- Fingers -->
      <path d="M 74,50 L 76,46" stroke="#fab005" stroke-width="2" stroke-linecap="round"/>
      <path d="M 72,48 L 74,44" stroke="#fab005" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Cheek blush -->
  <ellipse cx="28" cy="40" rx="3" ry="2" fill="#ffb6c1" opacity="0.5"/>
  <ellipse cx="52" cy="40" rx="3" ry="2" fill="#ffb6c1" opacity="0.5"/>
</svg>
