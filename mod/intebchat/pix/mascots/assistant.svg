<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="mascot-assistant">
  <style>
    .mascot-assistant {
      cursor: pointer;
    }
    /* Smooth transitions for natural feel */
    #orb-body {
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
    }
    #energy-ring ellipse {
      transition: stroke-width 0.5s ease, opacity 0.5s ease;
    }
    #face {
      transition: transform 0.3s ease-out;
    }
    #particles circle {
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    /* Hover states with subtle, natural movements */
    .mascot-assistant:hover #orb-body {
      transform: scale(1.03);
      filter: drop-shadow(0 4px 8px rgba(39, 84, 140, 0.3));
    }
    .mascot-assistant:hover #energy-ring ellipse {
      stroke-width: 1.5;
      opacity: 0.5;
    }
    .mascot-assistant:hover #face {
      transform: translateY(-1px);
    }
    .mascot-assistant:hover #particles circle:nth-child(1) {
      transform: translateY(-2px);
    }
    .mascot-assistant:hover #particles circle:nth-child(2) {
      transform: translateY(-3px);
    }
    .mascot-assistant:hover #particles circle:nth-child(3) {
      transform: translateY(-1px);
    }
    .mascot-assistant:hover #particles circle:nth-child(4) {
      transform: translateY(-2px);
    }
  </style>
  <defs>
    <!-- INTEB Brand Colors -->
    <radialGradient id="orb-gradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#6ba3d6"/>
      <stop offset="40%" style="stop-color:#27548c"/>
      <stop offset="100%" style="stop-color:#004e88"/>
    </radialGradient>
    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#27548c;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="accent-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63950"/>
      <stop offset="100%" style="stop-color:#d91e41"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#004e88" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="40" cy="74" rx="18" ry="4" fill="#27548c" opacity="0.15"/>

  <!-- Outer energy ring -->
  <g id="energy-ring">
    <ellipse cx="40" cy="40" rx="32" ry="32" fill="none" stroke="#27548c" stroke-width="1" opacity="0.3">
      <animate attributeName="rx" values="32;34;32" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="32;34;32" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Main orb body -->
  <g id="orb-body" filter="url(#shadow)">
    <circle cx="40" cy="40" r="28" fill="url(#orb-gradient)"/>
    <!-- Shine highlight -->
    <ellipse cx="32" cy="30" rx="10" ry="8" fill="#ffffff" opacity="0.25"/>
    <!-- Inner glow -->
    <circle cx="40" cy="40" r="20" fill="url(#inner-glow)"/>
  </g>

  <!-- Face area -->
  <g id="face">
    <!-- Face background -->
    <ellipse cx="40" cy="38" rx="18" ry="14" fill="#ffffff" opacity="0.1"/>

    <!-- Eyes -->
    <g id="eyes">
      <!-- Left eye -->
      <g id="left-eye">
        <ellipse cx="33" cy="36" rx="5" ry="6" fill="#ffffff" opacity="0.95"/>
        <ellipse cx="33" cy="37" rx="3.5" ry="4.5" fill="#1a3d5c"/>
        <ellipse cx="33" cy="37" rx="2" ry="2.5" fill="#0a2540"/>
        <circle cx="34.5" cy="35" r="1.2" fill="#ffffff" opacity="0.9"/>
        <!-- Blink -->
        <ellipse cx="33" cy="36" rx="5" ry="0" fill="#27548c">
          <animate attributeName="ry"
                   values="0;0;0;6;0;0;0"
                   dur="4s"
                   repeatCount="indefinite"
                   keyTimes="0;0.1;0.12;0.14;0.16;0.18;1"/>
        </ellipse>
      </g>

      <!-- Right eye -->
      <g id="right-eye">
        <ellipse cx="47" cy="36" rx="5" ry="6" fill="#ffffff" opacity="0.95"/>
        <ellipse cx="47" cy="37" rx="3.5" ry="4.5" fill="#1a3d5c"/>
        <ellipse cx="47" cy="37" rx="2" ry="2.5" fill="#0a2540"/>
        <circle cx="48.5" cy="35" r="1.2" fill="#ffffff" opacity="0.9"/>
        <!-- Blink -->
        <ellipse cx="47" cy="36" rx="5" ry="0" fill="#27548c">
          <animate attributeName="ry"
                   values="0;0;0;6;0;0;0"
                   dur="4s"
                   repeatCount="indefinite"
                   keyTimes="0;0.1;0.12;0.14;0.16;0.18;1"/>
        </ellipse>
      </g>
    </g>

    <!-- Smile -->
    <path d="M 34,48 Q 40,53 46,48"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.5"
          stroke-linecap="round"
          opacity="0.9"/>
  </g>

  <!-- Floating particles/sparkles -->
  <g id="particles">
    <!-- Particle 1 -->
    <circle cx="18" cy="25" r="2" fill="#d91e41" opacity="0.8">
      <animate attributeName="cy" values="25;20;25" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Particle 2 -->
    <circle cx="62" cy="30" r="1.5" fill="#d91e41" opacity="0.7">
      <animate attributeName="cy" values="30;24;30" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>

    <!-- Particle 3 -->
    <circle cx="22" cy="55" r="1.5" fill="#ffffff" opacity="0.6">
      <animate attributeName="cy" values="55;50;55" dur="2.2s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>

    <!-- Particle 4 -->
    <circle cx="58" cy="52" r="2" fill="#ffffff" opacity="0.7">
      <animate attributeName="cy" values="52;47;52" dur="2.8s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.8s" repeatCount="indefinite" begin="0.8s"/>
    </circle>

    <!-- Top sparkle -->
    <g transform="translate(40, 8)">
      <path d="M 0,-4 L 1,-1 L 4,0 L 1,1 L 0,4 L -1,1 L -4,0 L -1,-1 Z"
            fill="#d91e41" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="transform" values="scale(1);scale(0.7);scale(1)" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Orbiting dot -->
  <g id="orbit">
    <circle cx="40" cy="40" r="0" fill="#d91e41">
      <animate attributeName="cx"
               values="40;72;40;8;40"
               dur="4s"
               repeatCount="indefinite"/>
      <animate attributeName="cy"
               values="8;40;72;40;8"
               dur="4s"
               repeatCount="indefinite"/>
      <animate attributeName="r"
               values="2.5;2;2.5;2;2.5"
               dur="4s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="1;0.6;1;0.6;1"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle floating animation -->
  <animateTransform attributeName="transform"
                    type="translate"
                    values="0,0; 0,-2; 0,0"
                    dur="3s"
                    repeatCount="indefinite"/>
</svg>
