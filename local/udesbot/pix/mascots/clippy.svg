<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clippy-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0"/>
      <stop offset="30%" style="stop-color:#d8d8d8"/>
      <stop offset="70%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#a8a8a8"/>
    </linearGradient>
    <linearGradient id="clippy-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="clippy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="40" cy="76" rx="16" ry="3" fill="#00000015"/>

  <!-- Body - Stylized paperclip -->
  <g id="body" filter="url(#clippy-shadow)">
    <!-- Main clip frame - rounded U shape -->
    <path d="M 26,14
             C 26,8 31,4 40,4
             C 49,4 54,8 54,14
             L 54,64
             C 54,70 49,74 40,74
             C 31,74 26,70 26,64
             Z"
          fill="url(#clippy-metal)"
          stroke="#888888"
          stroke-width="2.5"/>

    <!-- Inner hole -->
    <path d="M 32,20
             L 32,58
             C 32,62 35,65 40,65
             C 45,65 48,62 48,58
             L 48,20
             C 48,16 45,13 40,13
             C 35,13 32,16 32,20
             Z"
          fill="#fafafa"
          stroke="#a0a0a0"
          stroke-width="1.5"/>

    <!-- Shine effect -->
    <path d="M 28,14
             C 28,10 32,6 40,6
             L 40,12
             C 34,12 32,14 32,18
             L 32,60
             C 32,62 34,64 38,64
             L 38,66
             C 32,66 28,63 28,58
             Z"
          fill="url(#clippy-shine)"/>
  </g>

  <!-- Eyes -->
  <g id="eyes">
    <!-- Left eye -->
    <g id="eye-left" transform-origin="36 32">
      <ellipse cx="36" cy="32" rx="6" ry="7" fill="#2d3748"/>
      <ellipse cx="37.5" cy="30" rx="2.5" ry="3" fill="#ffffff"/>
      <circle cx="35" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- Right eye -->
    <g id="eye-right" transform-origin="44 32">
      <ellipse cx="44" cy="32" rx="6" ry="7" fill="#2d3748"/>
      <ellipse cx="45.5" cy="30" rx="2.5" ry="3" fill="#ffffff"/>
      <circle cx="43" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- Eyebrows - expressive -->
  <g id="eyebrows">
    <path d="M 30,24 Q 36,21 42,24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
    <path d="M 38,24 Q 44,21 50,24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Mouth - friendly smile -->
  <g id="mouth">
    <path d="M 35,46 Q 40,52 45,46"
          fill="none"
          stroke="#2d3748"
          stroke-width="2.5"
          stroke-linecap="round"/>
  </g>

  <!-- Arms -->
  <g id="arms">
    <!-- Left arm -->
    <g id="arm-left" transform-origin="26 40">
      <path d="M 26,38 Q 16,34 12,38 Q 8,42 10,46"
            fill="none"
            stroke="url(#clippy-metal)"
            stroke-width="6"
            stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="10" cy="46" r="5" fill="url(#clippy-metal)" stroke="#888888" stroke-width="1"/>
      <path d="M 7,44 L 6,40" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
      <path d="M 10,43 L 10,39" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Right arm -->
    <g id="arm-right" transform-origin="54 40">
      <path d="M 54,38 Q 64,34 68,38 Q 72,42 70,46"
            fill="none"
            stroke="url(#clippy-metal)"
            stroke-width="6"
            stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="70" cy="46" r="5" fill="url(#clippy-metal)" stroke="#888888" stroke-width="1"/>
      <path d="M 73,44 L 74,40" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
      <path d="M 70,43 L 70,39" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Blush cheeks -->
  <ellipse cx="29" cy="40" rx="4" ry="2.5" fill="#ffb6c1" opacity="0.5"/>
  <ellipse cx="51" cy="40" rx="4" ry="2.5" fill="#ffb6c1" opacity="0.5"/>
</svg>
