<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Owl Mascot - Wise educational owl -->
  <defs>
    <linearGradient id="owlBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B4423;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="owlBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5DEB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="50" cy="60" rx="35" ry="35" fill="url(#owlBody)"/>
  <!-- Belly -->
  <ellipse cx="50" cy="65" rx="22" ry="25" fill="url(#owlBelly)"/>
  <!-- Belly pattern -->
  <path d="M 35 55 Q 50 50 65 55" fill="none" stroke="#C4A27C" stroke-width="1.5"/>
  <path d="M 33 62 Q 50 57 67 62" fill="none" stroke="#C4A27C" stroke-width="1.5"/>
  <path d="M 35 69 Q 50 64 65 69" fill="none" stroke="#C4A27C" stroke-width="1.5"/>
  <path d="M 37 76 Q 50 71 63 76" fill="none" stroke="#C4A27C" stroke-width="1.5"/>
  <!-- Ear tufts -->
  <polygon points="25,25 32,8 38,28" fill="#6B4423"/>
  <polygon points="75,25 68,8 62,28" fill="#6B4423"/>
  <!-- Head (overlaps ears) -->
  <circle cx="50" cy="35" r="28" fill="url(#owlBody)"/>
  <!-- Eye circles (white) -->
  <circle cx="38" cy="35" r="14" fill="white" stroke="#6B4423" stroke-width="2"/>
  <circle cx="62" cy="35" r="14" fill="white" stroke="#6B4423" stroke-width="2"/>
  <!-- Eye pupils -->
  <circle cx="40" cy="35" r="7" fill="#333"/>
  <circle cx="64" cy="35" r="7" fill="#333"/>
  <circle cx="42" cy="33" r="2.5" fill="white"/>
  <circle cx="66" cy="33" r="2.5" fill="white"/>
  <!-- Beak -->
  <polygon points="50,42 44,52 50,58 56,52" fill="#FF9800"/>
  <line x1="50" y1="48" x2="50" y2="56" stroke="#E65100" stroke-width="1"/>
  <!-- Wings -->
  <ellipse cx="20" cy="60" rx="12" ry="25" fill="#6B4423"/>
  <ellipse cx="80" cy="60" rx="12" ry="25" fill="#6B4423"/>
  <!-- Feet -->
  <g fill="#FF9800">
    <ellipse cx="40" cy="93" rx="8" ry="4"/>
    <ellipse cx="60" cy="93" rx="8" ry="4"/>
    <circle cx="35" cy="94" r="2"/>
    <circle cx="40" cy="95" r="2"/>
    <circle cx="45" cy="94" r="2"/>
    <circle cx="55" cy="94" r="2"/>
    <circle cx="60" cy="95" r="2"/>
    <circle cx="65" cy="94" r="2"/>
  </g>
  <!-- Graduation cap -->
  <polygon points="50,5 20,15 50,25 80,15" fill="#333"/>
  <rect x="45" y="5" width="10" height="8" fill="#333"/>
  <line x1="75" y1="15" x2="85" y2="25" stroke="#FFD700" stroke-width="2"/>
  <circle cx="85" cy="27" r="3" fill="#FFD700"/>
</svg>
