<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="owl-body-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9d7651;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6f47;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="owl-belly-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4a886;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="40" cy="76" rx="22" ry="4" fill="#00000020"/>

  <!-- Body -->
  <g id="body">
    <!-- Main body -->
    <ellipse cx="40" cy="52" rx="26" ry="28" fill="url(#owl-body-gradient)" stroke="#6b5437" stroke-width="2"/>

    <!-- Belly -->
    <ellipse cx="40" cy="55" rx="18" ry="20" fill="url(#owl-belly-gradient)"/>

    <!-- Belly pattern -->
    <path d="M 30,45 Q 40,50 50,45" fill="none" stroke="#b09070" stroke-width="1.5" opacity="0.5"/>
    <path d="M 28,52 Q 40,58 52,52" fill="none" stroke="#b09070" stroke-width="1.5" opacity="0.5"/>
    <path d="M 30,59 Q 40,66 50,59" fill="none" stroke="#b09070" stroke-width="1.5" opacity="0.5"/>
    <path d="M 34,66 Q 40,72 46,66" fill="none" stroke="#b09070" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Wings -->
  <g id="arms">
    <!-- Left wing -->
    <g id="arm-left" transform-origin="18 50">
      <ellipse cx="16" cy="50" rx="10" ry="22" fill="url(#owl-body-gradient)" stroke="#6b5437" stroke-width="1.5"/>
      <!-- Wing feathers -->
      <path d="M 10,38 L 8,42 M 12,44 L 9,48 M 11,52 L 8,56" stroke="#6b5437" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Right wing -->
    <g id="arm-right" transform-origin="62 50">
      <ellipse cx="64" cy="50" rx="10" ry="22" fill="url(#owl-body-gradient)" stroke="#6b5437" stroke-width="1.5"/>
      <!-- Wing feathers -->
      <path d="M 70,38 L 72,42 M 68,44 L 71,48 M 69,52 L 72,56" stroke="#6b5437" stroke-width="1" opacity="0.5"/>
    </g>
  </g>

  <!-- Face circle -->
  <circle cx="40" cy="32" r="20" fill="#d4b896" stroke="#6b5437" stroke-width="1"/>

  <!-- Eyes -->
  <g id="eyes">
    <!-- Left eye -->
    <g id="eye-left" transform-origin="32 30">
      <circle cx="32" cy="30" r="10" fill="#ffffff" stroke="#6b5437" stroke-width="2"/>
      <circle cx="32" cy="30" r="6" fill="#1a1a2e"/>
      <circle cx="34" cy="28" r="2.5" fill="#ffffff"/>
      <circle cx="30" cy="32" r="1" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- Right eye -->
    <g id="eye-right" transform-origin="48 30">
      <circle cx="48" cy="30" r="10" fill="#ffffff" stroke="#6b5437" stroke-width="2"/>
      <circle cx="48" cy="30" r="6" fill="#1a1a2e"/>
      <circle cx="50" cy="28" r="2.5" fill="#ffffff"/>
      <circle cx="46" cy="32" r="1" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- Eyebrows/Tufts -->
  <g id="eyebrows">
    <path d="M 22,18 Q 28,14 34,18" fill="none" stroke="#6b5437" stroke-width="3" stroke-linecap="round"/>
    <path d="M 46,18 Q 52,14 58,18" fill="none" stroke="#6b5437" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Beak -->
  <g id="beak">
    <path d="M 40,38 L 35,46 L 45,46 Z" fill="#ff8c00" stroke="#d47200" stroke-width="1.5"/>
  </g>

  <!-- Ear tufts -->
  <path d="M 22,12 L 26,20 L 30,14 Z" fill="url(#owl-body-gradient)" stroke="#6b5437" stroke-width="1"/>
  <path d="M 58,12 L 54,20 L 50,14 Z" fill="url(#owl-body-gradient)" stroke="#6b5437" stroke-width="1"/>

  <!-- Graduation cap -->
  <g id="cap">
    <!-- Cap base -->
    <polygon points="40,4 15,14 65,14" fill="#1a1a4e"/>
    <rect x="24" y="14" width="32" height="6" fill="#1a1a4e"/>

    <!-- Tassel -->
    <line x1="58" y1="12" x2="68" y2="18" stroke="#ffd700" stroke-width="2"/>
    <circle cx="68" cy="20" r="3" fill="#ffd700"/>
    <path d="M 66,22 L 68,28 L 70,22" fill="#ffd700"/>
  </g>

  <!-- Feet -->
  <g id="feet">
    <ellipse cx="34" cy="75" rx="5" ry="3" fill="#ff8c00" stroke="#d47200" stroke-width="1"/>
    <ellipse cx="46" cy="75" rx="5" ry="3" fill="#ff8c00" stroke="#d47200" stroke-width="1"/>
  </g>
</svg>
