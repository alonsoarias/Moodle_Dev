<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Lightbulb Mascot - Creative idea lightbulb -->
  <defs>
    <linearGradient id="bulbGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEB3B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="30%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFEB3B;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Glow effect -->
  <circle cx="50" cy="35" r="35" fill="url(#glowEffect)" filter="url(#glow)"/>
  <!-- Bulb glass -->
  <path d="M 30 45 Q 20 30 30 15 Q 40 0 50 0 Q 60 0 70 15 Q 80 30 70 45 Q 65 55 65 60 L 35 60 Q 35 55 30 45" 
        fill="url(#bulbGlow)" stroke="#FFA000" stroke-width="2"/>
  <!-- Highlight on glass -->
  <path d="M 35 25 Q 40 15 50 12" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Face -->
  <g id="eyes">
    <circle cx="40" cy="35" r="5" fill="white"/>
    <circle cx="60" cy="35" r="5" fill="white"/>
    <circle cx="41" cy="35" r="3" fill="#333"/>
    <circle cx="61" cy="35" r="3" fill="#333"/>
    <circle cx="42" cy="34" r="1" fill="white"/>
    <circle cx="62" cy="34" r="1" fill="white"/>
  </g>
  <!-- Happy smile -->
  <path d="M 42 45 Q 50 52 58 45" fill="none" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="32" cy="42" r="4" fill="#FF8A80" opacity="0.5"/>
  <circle cx="68" cy="42" r="4" fill="#FF8A80" opacity="0.5"/>
  <!-- Base/screw part -->
  <rect x="35" y="60" width="30" height="8" fill="#9E9E9E"/>
  <rect x="33" y="68" width="34" height="4" rx="1" fill="#757575"/>
  <rect x="35" y="72" width="30" height="4" rx="1" fill="#9E9E9E"/>
  <rect x="33" y="76" width="34" height="4" rx="1" fill="#757575"/>
  <rect x="35" y="80" width="30" height="4" rx="1" fill="#9E9E9E"/>
  <!-- Contact point -->
  <rect x="42" y="84" width="16" height="8" rx="2" fill="#424242"/>
  <circle cx="50" cy="90" r="4" fill="#616161"/>
  <!-- Arms (waving) -->
  <g id="arms">
    <path d="M 25 50 Q 15 45 12 35" fill="none" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    <circle cx="10" cy="33" r="5" fill="#FFEB3B" stroke="#FFA000" stroke-width="1"/>
    <path d="M 75 50 Q 85 45 88 35" fill="none" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    <circle cx="90" cy="33" r="5" fill="#FFEB3B" stroke="#FFA000" stroke-width="1"/>
  </g>
  <!-- Sparkles -->
  <g fill="#FFD54F">
    <polygon points="15,15 17,20 22,20 18,24 20,29 15,26 10,29 12,24 8,20 13,20"/>
    <polygon points="85,20 86,23 89,23 87,26 88,29 85,27 82,29 83,26 81,23 84,23" transform="scale(0.8) translate(10,-5)"/>
    <polygon points="50,5 51,8 54,8 52,10 53,13 50,11 47,13 48,10 46,8 49,8" transform="scale(0.6) translate(30,-8)"/>
  </g>
</svg>
