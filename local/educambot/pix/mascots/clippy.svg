<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Clippy Mascot - Classic paperclip assistant -->
  <defs>
    <linearGradient id="clipMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B0BEC5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ECEFF1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90A4AE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clipShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Paperclip body (bent wire shape) -->
  <path d="M 35 90 
           L 35 30 
           Q 35 15 50 15 
           Q 65 15 65 30 
           L 65 75 
           Q 65 85 55 85 
           Q 45 85 45 75 
           L 45 40
           Q 45 35 50 35
           Q 55 35 55 40
           L 55 65" 
        fill="none" 
        stroke="url(#clipMetal)" 
        stroke-width="8" 
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- Highlight on clip -->
  <path d="M 38 85 L 38 35 Q 38 22 50 22" 
        fill="none" 
        stroke="white" 
        stroke-width="2" 
        stroke-linecap="round"
        opacity="0.6"/>
  <!-- Eyes (large, expressive) -->
  <g id="eyes" transform="translate(-5, 0)">
    <!-- Left eye background -->
    <ellipse cx="45" cy="55" rx="12" ry="14" fill="white" stroke="#607D8B" stroke-width="1.5"/>
    <!-- Right eye background -->
    <ellipse cx="70" cy="55" rx="12" ry="14" fill="white" stroke="#607D8B" stroke-width="1.5"/>
    <!-- Left pupil -->
    <ellipse cx="47" cy="57" rx="5" ry="6" fill="#333"/>
    <circle cx="49" cy="55" r="2" fill="white"/>
    <!-- Right pupil -->
    <ellipse cx="72" cy="57" rx="5" ry="6" fill="#333"/>
    <circle cx="74" cy="55" r="2" fill="white"/>
    <!-- Eyebrows -->
    <path d="M 35 45 Q 45 40 55 45" fill="none" stroke="#607D8B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 60 45 Q 70 40 80 45" fill="none" stroke="#607D8B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Arms (raised in greeting) -->
  <g id="arms">
    <!-- Left arm -->
    <path d="M 30 65 Q 15 60 10 45" 
          fill="none" 
          stroke="url(#clipMetal)" 
          stroke-width="6" 
          stroke-linecap="round"/>
    <ellipse cx="8" cy="42" rx="5" ry="4" fill="#B0BEC5" stroke="#78909C" stroke-width="1"/>
    <!-- Right arm -->
    <path d="M 70 65 Q 85 60 90 45" 
          fill="none" 
          stroke="url(#clipMetal)" 
          stroke-width="6" 
          stroke-linecap="round"/>
    <ellipse cx="92" cy="42" rx="5" ry="4" fill="#B0BEC5" stroke="#78909C" stroke-width="1"/>
  </g>
  <!-- Smile -->
  <path d="M 42 72 Q 55 82 68 72" 
        fill="none" 
        stroke="#455A64" 
        stroke-width="2.5" 
        stroke-linecap="round"/>
</svg>
