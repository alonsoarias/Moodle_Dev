<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c8c8c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8a8a8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metal-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="40" cy="75" rx="18" ry="4" fill="#00000020"/>

  <!-- Body - Main clip shape -->
  <g id="body">
    <!-- Outer clip frame -->
    <path d="M 28,12 C 28,8 32,5 38,5 L 42,5 C 48,5 52,8 52,12 L 52,68 C 52,72 48,75 42,75 L 38,75 C 32,75 28,72 28,68 Z"
          fill="url(#metal-gradient)" stroke="#888888" stroke-width="2"/>

    <!-- Inner clip hole -->
    <path d="M 32,18 L 32,62 C 32,65 34,67 38,67 L 42,67 C 46,67 48,65 48,62 L 48,18 C 48,15 46,13 42,13 L 38,13 C 34,13 32,15 32,18 Z"
          fill="#f8f8f8" stroke="#999999" stroke-width="1"/>

    <!-- Highlight on clip -->
    <path d="M 30,12 C 30,10 32,7 38,7 L 40,7 L 40,15 L 34,15 L 34,68 C 34,70 35,71 38,71 L 38,73 C 33,73 30,71 30,68 Z"
          fill="url(#metal-highlight)"/>
  </g>

  <!-- Eyes -->
  <g id="eyes">
    <!-- Left eye -->
    <g id="eye-left" transform-origin="36 32">
      <ellipse cx="36" cy="32" rx="5" ry="6" fill="#1a1a2e"/>
      <ellipse cx="37" cy="30" rx="2" ry="2.5" fill="#ffffff"/>
      <ellipse cx="35" cy="34" rx="1" ry="1" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- Right eye -->
    <g id="eye-right" transform-origin="44 32">
      <ellipse cx="44" cy="32" rx="5" ry="6" fill="#1a1a2e"/>
      <ellipse cx="45" cy="30" rx="2" ry="2.5" fill="#ffffff"/>
      <ellipse cx="43" cy="34" rx="1" ry="1" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- Eyebrows -->
  <g id="eyebrows">
    <path d="M 31,26 Q 36,24 41,26" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 39,26 Q 44,24 49,26" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Mouth -->
  <g id="mouth">
    <path d="M 36,45 Q 40,50 44,45"
          fill="none"
          stroke="#1a1a2e"
          stroke-width="2.5"
          stroke-linecap="round"/>
  </g>

  <!-- Arms -->
  <g id="arms">
    <!-- Left arm -->
    <g id="arm-left" transform-origin="28 40">
      <path d="M 28,38 L 16,32 L 14,35 L 26,42 Z"
            fill="url(#metal-gradient)"
            stroke="#888888"
            stroke-width="1.5"/>
      <!-- Hand -->
      <circle cx="14" cy="33" r="4" fill="url(#metal-gradient)" stroke="#888888" stroke-width="1"/>
    </g>

    <!-- Right arm -->
    <g id="arm-right" transform-origin="52 40">
      <path d="M 52,38 L 64,32 L 66,35 L 54,42 Z"
            fill="url(#metal-gradient)"
            stroke="#888888"
            stroke-width="1.5"/>
      <!-- Hand -->
      <circle cx="66" cy="33" r="4" fill="url(#metal-gradient)" stroke="#888888" stroke-width="1"/>
    </g>
  </g>

  <!-- Cheeks (blush) -->
  <ellipse cx="30" cy="40" rx="3" ry="2" fill="#ffb6c1" opacity="0.4"/>
  <ellipse cx="50" cy="40" rx="3" ry="2" fill="#ffb6c1" opacity="0.4"/>
</svg>
