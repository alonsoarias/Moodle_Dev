<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cat Mascot - Friendly orange cat -->
  <defs>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Ears -->
  <polygon points="22,35 30,8 42,30" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
  <polygon points="78,35 70,8 58,30" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
  <!-- Inner ears -->
  <polygon points="26,32 32,15 38,30" fill="#FFB74D"/>
  <polygon points="74,32 68,15 62,30" fill="#FFB74D"/>
  <!-- Head -->
  <ellipse cx="50" cy="45" rx="32" ry="28" fill="url(#catBody)"/>
  <!-- Face markings -->
  <ellipse cx="50" cy="52" rx="20" ry="16" fill="#FFE0B2"/>
  <!-- Eyes -->
  <g id="eyes">
    <ellipse cx="38" cy="42" rx="9" ry="10" fill="white"/>
    <ellipse cx="62" cy="42" rx="9" ry="10" fill="white"/>
    <ellipse cx="39" cy="43" rx="5" ry="6" fill="#4CAF50"/>
    <ellipse cx="63" cy="43" rx="5" ry="6" fill="#4CAF50"/>
    <ellipse cx="39" cy="43" rx="2.5" ry="5" fill="#333"/>
    <ellipse cx="63" cy="43" rx="2.5" ry="5" fill="#333"/>
    <circle cx="41" cy="41" r="2" fill="white"/>
    <circle cx="65" cy="41" r="2" fill="white"/>
  </g>
  <!-- Nose -->
  <ellipse cx="50" cy="52" rx="4" ry="3" fill="#E91E63"/>
  <!-- Mouth -->
  <path d="M 50 55 L 50 60 M 45 62 Q 50 58 50 60 M 55 62 Q 50 58 50 60" fill="none" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whiskers -->
  <g stroke="#5D4037" stroke-width="1" stroke-linecap="round">
    <line x1="25" y1="48" x2="38" y2="52"/>
    <line x1="24" y1="54" x2="38" y2="55"/>
    <line x1="25" y1="60" x2="38" y2="58"/>
    <line x1="75" y1="48" x2="62" y2="52"/>
    <line x1="76" y1="54" x2="62" y2="55"/>
    <line x1="75" y1="60" x2="62" y2="58"/>
  </g>
  <!-- Body -->
  <ellipse cx="50" cy="80" rx="25" ry="18" fill="url(#catBody)"/>
  <!-- Belly -->
  <ellipse cx="50" cy="82" rx="15" ry="12" fill="#FFE0B2"/>
  <!-- Paws -->
  <ellipse cx="32" cy="92" rx="8" ry="5" fill="url(#catBody)"/>
  <ellipse cx="68" cy="92" rx="8" ry="5" fill="url(#catBody)"/>
  <ellipse cx="32" cy="93" rx="6" ry="3" fill="#FFB74D"/>
  <ellipse cx="68" cy="93" rx="6" ry="3" fill="#FFB74D"/>
  <!-- Stripes on forehead -->
  <path d="M 50 25 L 50 35" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
  <path d="M 42 28 Q 45 32 44 36" stroke="#E65100" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 58 28 Q 55 32 56 36" stroke="#E65100" stroke-width="1.5" stroke-linecap="round"/>
</svg>
