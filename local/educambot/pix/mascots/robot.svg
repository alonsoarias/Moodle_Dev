<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Robot Mascot - Friendly assistant robot -->
  <defs>
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5B9BD5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B6CA8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robotHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#70B8FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B9BD5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="50" y1="8" x2="50" y2="18" stroke="#5B9BD5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="6" r="4" fill="#FFD700"/>
  <!-- Head -->
  <rect id="head" x="25" y="18" width="50" height="40" rx="8" fill="url(#robotHead)" stroke="#3B6CA8" stroke-width="2"/>
  <!-- Eyes -->
  <g id="eyes">
    <circle cx="38" cy="38" r="8" fill="white"/>
    <circle cx="62" cy="38" r="8" fill="white"/>
    <circle cx="40" cy="38" r="4" fill="#333"/>
    <circle cx="64" cy="38" r="4" fill="#333"/>
    <circle cx="41" cy="37" r="1.5" fill="white"/>
    <circle cx="65" cy="37" r="1.5" fill="white"/>
  </g>
  <!-- Mouth - smile -->
  <path d="M 38 48 Q 50 56 62 48" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Body -->
  <rect id="body" x="30" y="60" width="40" height="30" rx="6" fill="url(#robotBody)" stroke="#3B6CA8" stroke-width="2"/>
  <!-- Chest panel -->
  <rect x="38" y="65" width="24" height="12" rx="3" fill="#FFD700" opacity="0.8"/>
  <rect x="42" y="68" width="4" height="6" rx="1" fill="#FF6B6B"/>
  <rect x="48" y="68" width="4" height="6" rx="1" fill="#4ECDC4"/>
  <rect x="54" y="68" width="4" height="6" rx="1" fill="#45B7D1"/>
  <!-- Arms -->
  <g id="arms">
    <rect x="18" y="62" width="10" height="20" rx="5" fill="url(#robotBody)" stroke="#3B6CA8" stroke-width="1.5"/>
    <rect x="72" y="62" width="10" height="20" rx="5" fill="url(#robotBody)" stroke="#3B6CA8" stroke-width="1.5"/>
    <circle cx="23" cy="84" r="5" fill="#5B9BD5" stroke="#3B6CA8" stroke-width="1.5"/>
    <circle cx="77" cy="84" r="5" fill="#5B9BD5" stroke="#3B6CA8" stroke-width="1.5"/>
  </g>
  <!-- Ears -->
  <rect x="20" y="28" width="5" height="20" rx="2" fill="#5B9BD5"/>
  <rect x="75" y="28" width="5" height="20" rx="2" fill="#5B9BD5"/>
</svg>
