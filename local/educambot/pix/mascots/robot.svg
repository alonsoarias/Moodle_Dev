<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="robot-body-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5da3f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robot-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b0b0b0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="40" cy="76" rx="20" ry="4" fill="#00000020"/>

  <!-- Body -->
  <g id="body">
    <!-- Main body -->
    <rect x="18" y="28" width="44" height="44" rx="8" fill="url(#robot-body-gradient)" stroke="#2e5c8a" stroke-width="2"/>

    <!-- Chest panel -->
    <rect x="24" y="34" width="32" height="32" rx="4" fill="#ffffff" opacity="0.2"/>

    <!-- Control panel -->
    <g id="panel">
      <rect x="28" y="54" width="6" height="6" rx="1" fill="#ff6b6b"/>
      <rect x="37" y="54" width="6" height="6" rx="1" fill="#ffd93d"/>
      <rect x="46" y="54" width="6" height="6" rx="1" fill="#6bcf7f"/>
    </g>

    <!-- Vent lines -->
    <line x1="28" y1="40" x2="52" y2="40" stroke="#2e5c8a" stroke-width="1" opacity="0.3"/>
    <line x1="28" y1="44" x2="52" y2="44" stroke="#2e5c8a" stroke-width="1" opacity="0.3"/>
    <line x1="28" y1="48" x2="52" y2="48" stroke="#2e5c8a" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Head -->
  <g id="head">
    <rect x="22" y="8" width="36" height="24" rx="6" fill="url(#robot-body-gradient)" stroke="#2e5c8a" stroke-width="2"/>

    <!-- Screen/Face area -->
    <rect x="26" y="12" width="28" height="16" rx="3" fill="#1a1a2e"/>
  </g>

  <!-- Antenna -->
  <g id="antenna">
    <line x1="40" y1="2" x2="40" y2="8" stroke="#2e5c8a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="2" r="4" fill="#ff6b6b" id="antenna-light"/>
  </g>

  <!-- Eyes (LED) -->
  <g id="eyes">
    <g id="eye-left" transform-origin="32 20">
      <circle cx="32" cy="20" r="5" fill="#00ff88" opacity="0.9"/>
      <circle cx="32" cy="20" r="3" fill="#00ff88"/>
      <circle cx="33" cy="19" r="1.5" fill="#ffffff" opacity="0.6"/>
    </g>

    <g id="eye-right" transform-origin="48 20">
      <circle cx="48" cy="20" r="5" fill="#00ff88" opacity="0.9"/>
      <circle cx="48" cy="20" r="3" fill="#00ff88"/>
      <circle cx="49" cy="19" r="1.5" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>

  <!-- Arms -->
  <g id="arms">
    <!-- Left arm -->
    <g id="arm-left" transform-origin="18 42">
      <rect x="6" y="36" width="16" height="8" rx="4" fill="url(#robot-body-gradient)" stroke="#2e5c8a" stroke-width="1.5"/>
      <!-- Hand -->
      <circle cx="6" cy="40" r="5" fill="url(#robot-metal)" stroke="#888888" stroke-width="1"/>
      <!-- Fingers -->
      <rect x="2" y="36" width="3" height="3" rx="1" fill="url(#robot-metal)"/>
      <rect x="2" y="41" width="3" height="3" rx="1" fill="url(#robot-metal)"/>
    </g>

    <!-- Right arm -->
    <g id="arm-right" transform-origin="62 42">
      <rect x="58" y="36" width="16" height="8" rx="4" fill="url(#robot-body-gradient)" stroke="#2e5c8a" stroke-width="1.5"/>
      <!-- Hand -->
      <circle cx="74" cy="40" r="5" fill="url(#robot-metal)" stroke="#888888" stroke-width="1"/>
      <!-- Fingers -->
      <rect x="75" y="36" width="3" height="3" rx="1" fill="url(#robot-metal)"/>
      <rect x="75" y="41" width="3" height="3" rx="1" fill="url(#robot-metal)"/>
    </g>
  </g>

  <!-- Ears/Side panels -->
  <rect x="14" y="14" width="6" height="12" rx="2" fill="url(#robot-metal)" stroke="#888888" stroke-width="1"/>
  <rect x="60" y="14" width="6" height="12" rx="2" fill="url(#robot-metal)" stroke="#888888" stroke-width="1"/>
</svg>
