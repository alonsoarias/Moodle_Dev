<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="robot-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6bb3f7"/>
      <stop offset="50%" style="stop-color:#4a9ee8"/>
      <stop offset="100%" style="stop-color:#3182ce"/>
    </linearGradient>
    <linearGradient id="robot-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5282"/>
      <stop offset="100%" style="stop-color:#1a365d"/>
    </linearGradient>
    <linearGradient id="robot-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="50%" style="stop-color:#c8c8c8"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
    <linearGradient id="robot-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7fffd4"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
    <filter id="robot-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="40" cy="77" rx="22" ry="3" fill="#00000015"/>

  <!-- Body -->
  <g id="body" filter="url(#robot-shadow)">
    <!-- Main body -->
    <rect x="16" y="32" width="48" height="42" rx="10" fill="url(#robot-body)" stroke="#2c5282" stroke-width="2"/>

    <!-- Chest panel -->
    <rect x="22" y="38" width="36" height="30" rx="6" fill="url(#robot-dark)" opacity="0.3"/>

    <!-- Heart/Core -->
    <circle cx="40" cy="52" r="8" fill="url(#robot-dark)"/>
    <circle cx="40" cy="52" r="5" fill="url(#robot-glow)" filter="url(#glow-filter)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Control buttons -->
    <g id="buttons">
      <circle cx="28" cy="64" r="3" fill="#ff6b6b"/>
      <circle cx="40" cy="64" r="3" fill="#ffd93d"/>
      <circle cx="52" cy="64" r="3" fill="#48bb78"/>
    </g>
  </g>

  <!-- Head -->
  <g id="head" filter="url(#robot-shadow)">
    <rect x="20" y="6" width="40" height="28" rx="8" fill="url(#robot-body)" stroke="#2c5282" stroke-width="2"/>

    <!-- Screen/Face area -->
    <rect x="24" y="10" width="32" height="20" rx="5" fill="url(#robot-dark)"/>
  </g>

  <!-- Antenna -->
  <g id="antenna">
    <line x1="40" y1="0" x2="40" y2="6" stroke="#2c5282" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="0" r="4" fill="#ff6b6b" id="antenna-light" filter="url(#glow-filter)">
      <animate attributeName="fill" values="#ff6b6b;#ff8c8c;#ff6b6b" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Eyes (LED) -->
  <g id="eyes">
    <g id="eye-left" transform-origin="32 20">
      <circle cx="32" cy="20" r="6" fill="#00000030"/>
      <circle cx="32" cy="20" r="5" fill="url(#robot-glow)" filter="url(#glow-filter)"/>
      <circle cx="33.5" cy="18.5" r="2" fill="#ffffff" opacity="0.7"/>
    </g>

    <g id="eye-right" transform-origin="48 20">
      <circle cx="48" cy="20" r="6" fill="#00000030"/>
      <circle cx="48" cy="20" r="5" fill="url(#robot-glow)" filter="url(#glow-filter)"/>
      <circle cx="49.5" cy="18.5" r="2" fill="#ffffff" opacity="0.7"/>
    </g>
  </g>

  <!-- Mouth - LED display smile -->
  <g id="mouth">
    <path d="M 35,26 L 37,28 L 40,26 L 43,28 L 45,26"
          fill="none"
          stroke="url(#robot-glow)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Arms -->
  <g id="arms">
    <!-- Left arm -->
    <g id="arm-left" transform-origin="16 46">
      <rect x="4" y="40" width="14" height="10" rx="5" fill="url(#robot-body)" stroke="#2c5282" stroke-width="1.5"/>
      <!-- Hand -->
      <circle cx="4" cy="45" r="6" fill="url(#robot-metal)" stroke="#888888" stroke-width="1"/>
      <!-- Fingers -->
      <rect x="-1" y="40" width="3" height="4" rx="1.5" fill="url(#robot-metal)"/>
      <rect x="-1" y="46" width="3" height="4" rx="1.5" fill="url(#robot-metal)"/>
    </g>

    <!-- Right arm -->
    <g id="arm-right" transform-origin="64 46">
      <rect x="62" y="40" width="14" height="10" rx="5" fill="url(#robot-body)" stroke="#2c5282" stroke-width="1.5"/>
      <!-- Hand -->
      <circle cx="76" cy="45" r="6" fill="url(#robot-metal)" stroke="#888888" stroke-width="1"/>
      <!-- Fingers -->
      <rect x="78" y="40" width="3" height="4" rx="1.5" fill="url(#robot-metal)"/>
      <rect x="78" y="46" width="3" height="4" rx="1.5" fill="url(#robot-metal)"/>
    </g>
  </g>

  <!-- Ears/Sensors -->
  <rect x="12" y="12" width="6" height="16" rx="3" fill="url(#robot-metal)" stroke="#888888" stroke-width="1"/>
  <rect x="62" y="12" width="6" height="16" rx="3" fill="url(#robot-metal)" stroke="#888888" stroke-width="1"/>
</svg>
